<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Local Drop</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="header">
    <h2>Local AirDrop</h2>
    <button class="qr-btn" onclick="toggleQR()">📱 Connect Mobile</button>
  </div>

  <div id="qr-container">
    <p>Scan with phone camera to connect:</p>
    <img src="/qr" alt="QR Code">
  </div>
  
  <div id="drop-zone">
    <p>Drag & drop files here or click to select</p>
    <input type="file" id="file-input" style="display: none;">
  </div>

  <div class="text-share-box">
    <h3>Shared Clipboard</h3>
    <textarea id="shared-text" placeholder="Paste links, notes, or text here to share across devices..."></textarea>
    <div class="text-actions">
      <button class="btn" onclick="saveText()">📤 Share Text</button>
      <button class="btn secondary" onclick="copyText()">📋 Copy to Clipboard</button>
    </div>
  </div>

  <h3>Shared Files</h3>
  <ul id="file-list"></ul>

  <script src="/static/app.js"></script>
</body>
</html>

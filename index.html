<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Local Drop</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="header">
    <div class="title-group">
      <h2>Local AirDrop</h2>
      <div class="device-name-container">
        <input 
          type="text" 
          id="device-name" 
          class="device-input" 
          placeholder="Device name..." 
          onchange="saveDeviceName()"
          title="Click to edit device name"
        >
        <span class="edit-icon" onclick="document.getElementById('device-name').focus()">✏️</span>
      </div>
    </div>
    <button class="qr-btn" onclick="toggleQR()">📱 Connect Mobile</button>
  </div>

  <div id="qr-container">
    <p>Scan with phone camera to connect:</p>
    <img src="/qr" alt="QR Code">
  </div>
  
  <div id="drop-zone">
    <p>Drag & drop files here or click to select</p>
    <input type="file" id="file-input" style="display: none;">
  </div>

  <div class="text-share-box">
    <div class="box-header">
      <h3>Shared Clipboard</h3>
      <button id="clear-all-text-btn" class="delete-btn" onclick="clearAllSnippets()" style="display: none;">Clear All</button>
    </div>
    
    <textarea id="shared-text" placeholder="Paste links, notes, or text here to share..."></textarea>
    
    <div class="text-actions">
      <button class="btn" onclick="saveText()">📤 Share Snippet</button>
      <button id="toggle-history-btn" class="toggle-btn" onclick="toggleHistory()" style="display: none;">📜 View History</button>
    </div>

    <!-- Displays the single most recent item by default -->
    <div id="latest-snippet"></div>

    <!-- Displays older history when expanded -->
    <div id="text-history" class="text-history-list" style="display: none;"></div>
  </div>

  <h3>Shared Files</h3>
  <ul id="file-list"></ul>

  <script src="/static/app.js"></script>
</body>
</html>

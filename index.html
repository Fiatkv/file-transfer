<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Local Drop</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 0 20px;
      color: #333;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    h2 { margin: 0; }
    .qr-btn {
      background: #f0f0f0;
      border: 1px solid #ccc;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: background 0.2s;
    }
    .qr-btn:hover { background: #e2e2e2; }
    .actions {
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .delete-btn {
      color: #e53e3e;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 14px;
      padding: 0;
    }
    .delete-btn:hover {
      text-decoration: underline;
    }
    
    #qr-container {
      display: none;
      text-align: center;
      padding: 16px;
      margin-bottom: 20px;
      background: #fafafa;
      border: 1px solid #eee;
      border-radius: 8px;
    }
    #qr-container img {
      width: 160px;
      height: 160px;
      border-radius: 6px;
      border: 1px solid #ddd;
    }
    #qr-container p {
      margin: 0 0 10px 0;
      font-size: 14px;
      color: #666;
    }

    #drop-zone {
      border: 2px dashed #ccc;
      border-radius: 8px;
      padding: 40px;
      text-align: center;
      background: #fafafa;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }
    #drop-zone.hover { border-color: #0070f3; background: #f0f7ff; }
    ul { list-style: none; padding: 0; }
    li {
      padding: 12px 0;
      border-bottom: 1px solid #eee;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    a { color: #0070f3; text-decoration: none; font-weight: 500; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="header">
    <h2>Local AirDrop</h2>
    <button class="qr-btn" onclick="toggleQR()">📱 Connect Mobile</button>
  </div>

  <div id="qr-container">
    <p>Scan with phone camera to connect:</p>
    <img src="/qr" alt="QR Code">
  </div>
  
  <div id="drop-zone">
    <p>Drag & drop files here or click to select</p>
    <input type="file" id="file-input" style="display: none;">
  </div>

  <h3>Shared Files</h3>
  <ul id="file-list"></ul>

  <script>
    const dropZone = document.getElementById('drop-zone');
    const fileInput = document.getElementById('file-input');
    const fileList = document.getElementById('file-list');
    const qrContainer = document.getElementById('qr-container');

    function toggleQR() {
      const isHidden = qrContainer.style.display === 'none' || qrContainer.style.display === '';
      qrContainer.style.display = isHidden ? 'block' : 'none';
    }

    dropZone.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', () => uploadFile(fileInput.files[0]));

    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('hover'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('hover'));
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('hover');
      if (e.dataTransfer.files.length) uploadFile(e.dataTransfer.files[0]);
    });

    async function uploadFile(file) {
      if (!file) return;
      const formData = new FormData();
      formData.append('file', file);

      await fetch('/files', { method: 'POST', body: formData });
    }

    async function deleteFile(filename) {
      if (!confirm(`Delete ${filename}?`)) return;

      const res = await fetch(`/files/${encodeURIComponent(filename)}`, { method: 'DELETE' });
      if (!res.ok) {
        alert('Failed to delete file.');
      }
    }

    async function loadFiles() {
      const res = await fetch('/files');
      const data = await res.json();
      fileList.innerHTML = data.files.map(name => `
        <li>
          <span>${name}</span>
          <div class="actions">
            <a href="/files/${encodeURIComponent(name)}" download>Download</a>
            <button class="delete-btn" onclick="deleteFile('${name.replace(/'/g, "\\'")}')">Delete</button>
          </div>
        </li>
      `).join('');
    }

    // --- WebSocket Setup ---
    const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
    const wsUrl = `${protocol}//${window.location.host}/ws`;
    let ws;

    function connectWebSocket() {
      ws = new WebSocket(wsUrl);

      ws.onmessage = (event) => {
        if (event.data === 'refresh') {
          loadFiles();
        }
      };

      ws.onclose = () => {
        // Reconnect after 2 seconds if connection drops or server restarts
        setTimeout(connectWebSocket, 2000);
      };
    }

    // Initialize initial list and WebSocket connection
    loadFiles();
    connectWebSocket();
  </script>
</body>
</html>
